services:
  - type: web
    name: retailpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RETAILPULSE_ADMIN_EMAIL
        sync: false
      - key: RETAILPULSE_ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: AI_SERVICE_BASE_URL
        value: https://retailpulse-ai.onrender.com/ml

  - type: web
    name: retailpulse-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
