spring:
  datasource:
    url: jdbc:h2:mem:retailpulse;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025

retailpulse:
  jwt:
    secret: TestSecretKeyForJWTSigningMustBe256BitsLongMinimumValue!!
    access-expiration-ms: 3600000
    refresh-expiration-ms: 2592000000
    temp-token-expiration-ms: 600000
