name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        working-directory: backend
        run: mvn -B -q test

  frontend:
    name: Frontend build (Vite + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI service smoke test
    runs-on: ubuntu-latest
    env:
      LSTM_EPOCHS: "3"
      MODELS_DIR: /tmp/rp-ci-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt
      - name: Byte-compile all modules
        working-directory: ai-service
        run: python -m compileall -q .
      - name: Train-and-predict smoke test (no DB needed)
        working-directory: ai-service
        run: python scripts/smoke_test.py
