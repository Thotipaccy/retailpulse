services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retailpulse_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailpulse_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./ai-service
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: retailpulse_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-only-secret-change-me-32-chars-min!!
      RETAILPULSE_ADMIN_EMAIL: admin@retailpulse.local
      RETAILPULSE_ADMIN_PASSWORD: admin12345
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_OTP_TO_CONSOLE: "true"
      AI_SERVICE_BASE_URL: http://ai:8000/ml
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
